name: Test and Build

on:
  push:
    branches: [main, next, develop]
  pull_request:
    branches: [main, next, develop]
  # Merge-queue entries. Without this trigger a queued PR waits for the
  # required PR Validation check that never starts, and times out of the
  # queue. A queue entry runs the same suite as a push.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Check package contents
        run: npm pack --dry-run

  # Was named `lint` -- but its only step runs `npm run build` (vite build +
  # tsc), so the fleet audit flagged it as a lint job that does not lint.
  # Renamed to what it actually is; this package has no linter configured, and
  # pretending otherwise is worse than saying so.
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check via build
        run: npm run build

  # Release-readiness signal on main. It used to re-run tests, the build and
  # the Storybook build -- all of which `test` and `typecheck` in the same
  # run had just done -- so its only unique contribution was `npm pack
  # --dry-run` (the test job's pack check runs on the matrix; this one is the
  # post-merge signal on main). It now runs exactly that.
  publish-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, typecheck]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check package contents
        run: npm run build && npm pack --dry-run

  supply-chain:
    name: Supply chain
    # Phase 02: the fleet's shared supply-chain checks from the control plane.
    uses: crossroads-hq/crossroads-ci/.github/workflows/_supply-chain.yml@b6d6ff2d2b709a42fb174c21f80549a95ddb1d56 # main
    permissions:
      contents: read
    with:
      npm-audit: true

  pr_validation:
    name: PR Validation
    # Aggregate gate; the name is the fleet's required check and never
    # changes. Logic lives in the control plane's composite action -- a
    # composite, not a reusable workflow, precisely so this job's check
    # context stays intact. `publish-check` stays out of `needs`: its own
    # `if` restricts it to pushes to main, and a gate requiring it would fail
    # every pull request on a dependency that was never meant to run there.
    if: ${{ !cancelled() }}
    needs: [test, typecheck, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required results
        uses: crossroads-hq/crossroads-ci/actions/gate@b6d6ff2d2b709a42fb174c21f80549a95ddb1d56 # main
        with:
          results: |
            {
              "Tests": "${{ needs.test.result }}",
              "Typecheck": "${{ needs.typecheck.result }}",
              "Supply chain": "${{ needs.supply-chain.result }}"
            }
