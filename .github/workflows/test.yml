name: Test and Build

on:
  push:
    branches: [main, next, develop]
  pull_request:
    branches: [main, next, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Check package contents
        run: npm pack --dry-run

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run build

  publish-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run release check
        run: npm run build && npm run build-storybook && npm pack --dry-run

  supply-chain:
    name: Supply chain
    # Phase 02: the fleet's shared supply-chain checks from the control plane.
    uses: tsviser/crossroads-ci/.github/workflows/_supply-chain.yml@main
    permissions:
      contents: read
    with:
      npm-audit: true

  pr_validation:
    name: PR Validation
    # Aggregate gate. Every Crossroads repository exposes one required status
    # check under this exact name, so the jobs beneath it can be renamed, split
    # or extended without touching the branch protection rule. GitHub stores a
    # required check as plain text rather than as a reference to a job, so a
    # rename made without updating the rule fails silently rather than loudly.
    #
    # `needs` names the jobs, not the matrix legs. The `test` legs report as
    # "test (20.x)" and "test (22.x)", so requiring them individually would pin
    # a Node version into branch protection and silently exempt any version
    # added to the matrix later. Depending on the job aggregates every leg.
    #
    # `publish-check` is deliberately excluded: its own `if` restricts it to
    # pushes to main, so on a pull request it is skipped, and a gate that
    # required it would fail every pull request on a dependency that was never
    # meant to run there.
    #
    # `!cancelled()` rather than `always()`. The concurrency group above cancels
    # the in-progress run on every new push, so a superseded run's jobs report
    # `cancelled` -- and an `always()` gate would turn that into a hard failure,
    # leaving a red check on a commit nobody is waiting on while the
    # replacement run goes green beside it. A superseded run should render no
    # verdict. A job cancelled on its own while its run stays live is different:
    # `cancelled()` is false there, so the gate still runs and the check below
    # still refuses to pass a job that did not finish.
    if: ${{ !cancelled() }}
    needs: [test, lint, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No checkout step: this job reads job results, not the repository.
      - name: Check required results
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          echo "Tests:        $TEST_RESULT"
          echo "Lint:         $LINT_RESULT"
          echo "Supply chain: $SUPPLY_CHAIN_RESULT"
          status=0
          for pair in "Tests:$TEST_RESULT" "Lint:$LINT_RESULT" "Supply chain:$SUPPLY_CHAIN_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            [ "$result" = "success" ] && continue
            if [ "$result" = "cancelled" ]; then
              echo "$name was cancelled while this run stayed live; a required job that did not finish cannot pass the gate." >&2
            else
              echo "$name did not pass ($result)." >&2
            fi
            status=1
          done
          exit "$status"
